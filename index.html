<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Drone Quest - Transversal Project</title>
  <meta name="description" content="Transversal Project site (Master in Drones): assembly, set-up and first flights of a Hexsoon EDU450, told as a retro pixel-art adventure.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <a class="logo" href="#/">DRONE QUEST</a>
      <nav id="crumbs" aria-label="Breadcrumb"></nav>
      <a id="pilot" class="pilot" href="#/select" title="Change pilot">
        <img id="pilotImg" alt="" width="32" height="48"><span><small>PILOT</small><b id="pilotName"></b></span>
      </a>
      <div class="hud-btns">
        <button class="btn" id="btnMap" type="button">MAP</button>
        <button class="btn" id="btnMenu" type="button">MENU</button>
        <button class="btn" id="btnSound" type="button" aria-pressed="false">SOUND OFF</button>
      </div>
    </header>

    <main id="stage">
      <canvas id="screen" width="480" height="270" tabindex="0"
        aria-label="Drone Quest game screen. Use the arrow keys or click the buildings. All content is also available from the MENU and the Classic view."></canvas>
    </main>

    <footer id="hint">
      <span id="hintText"></span>
      <a href="#/classic" class="classic-link">CLASSIC VIEW</a>
      <span id="lastUpdate"></span>
    </footer>
  </div>

  <!-- detail window (activities and menu pages) -->
  <div id="overlay" class="overlay" hidden>
    <div id="panel" class="win" role="dialog" aria-modal="true" aria-labelledby="pTitle" tabindex="-1"></div>
  </div>

  <!-- in-game menu -->
  <div id="menuWrap" class="overlay menu-wrap" hidden>
    <div id="menu" class="win" role="menu" aria-label="Menu"></div>
  </div>

  <!-- classic view: all the content as a plain document -->
  <div id="classic" class="overlay classic" hidden>
    <div id="classicDoc" class="win doc"></div>
  </div>

  <!-- links for screen readers and search engines -->
  <nav id="srNav" class="sr-only" aria-label="Site sections"></nav>

  <noscript>
    <p class="noscript">This site is a small game and needs JavaScript enabled.</p>
  </noscript>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/scenes.js"></script>
  <script src="assets/js/labs.js"></script>
  <script src="assets/js/hangar.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
